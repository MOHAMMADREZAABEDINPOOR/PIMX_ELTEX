name: Build and deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 8f59437c5f387ae9237f327f1eb5b791
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_SITE_URL: https://pimx-eltex.mohammadrezaabedinpoor6.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run typecheck
      - run: npx opennextjs-cloudflare build
      - name: Deploy Worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN to GitHub Actions secrets to enable automatic deployment.'
            exit 1
          fi
          npx wrangler deploy
